<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mega Man 3 (NES) — Kubo Touch</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #141824;
      --accent: #d9381e;
      --accent-hover: #f24b30;
      --text: #f5f7fa;
      --muted: #9aa3b2;
      --border: rgba(255, 255, 255, 0.08);
      --cart-gray: #c6c9cf;
      --cart-gray-light: #dfe2e8;
      --cart-gray-dark: #8c9099;
      --cart-gray-deep: #6b6f78;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #181e2e 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .launcher {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    /* Palco 3D do Cartucho NES */
    .cart-stage {
      position: relative;
      width: 100%;
      height: 290px;
      margin-bottom: 18px;
      perspective: 1100px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .nes-cart {
      --rx: 6deg;
      --ry: -18deg;
      --gx: 50%;
      --gy: 30%;
      --w: 212px;
      --h: 244px;
      --d: 34px;

      position: relative;
      width: var(--w);
      height: var(--h);
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform 0.14s ease-out;
    }

    .cart-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 6px;
    }

    /* Frente do cartucho NES */
    .cart-front {
      width: var(--w);
      height: var(--h);
      transform: translateZ(calc(var(--d) / 2));
      background: linear-gradient(160deg, var(--cart-gray-light) 0%, var(--cart-gray) 65%, var(--cart-gray-dark) 100%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 12px;
      overflow: hidden;
    }

    /* Friso superior clássico do cartucho NES */
    .cart-ridge-grip {
      width: 100%;
      height: 22px;
      border-radius: 4px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.14) 0px,
        rgba(0, 0, 0, 0.14) 2px,
        rgba(255, 255, 255, 0.25) 2px,
        rgba(255, 255, 255, 0.25) 4px
      );
      border: 1px solid rgba(0, 0, 0, 0.16);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    /* Rótulo / Capa do jogo no cartucho */
    .cart-label {
      position: relative;
      width: 100%;
      flex: 1;
      border-radius: 5px;
      overflow: hidden;
      background: #0d1018;
      border: 2px solid #2b2e36;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Reflexo especular sobre a frente e rótulo */
    .cart-front::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle at var(--gx) var(--gy),
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.05) 38%,
        transparent 70%
      );
      mix-blend-mode: screen;
    }

    /* Traseira do cartucho */
    .cart-back {
      width: var(--w);
      height: var(--h);
      transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
      background: linear-gradient(180deg, var(--cart-gray-dark), var(--cart-gray-deep));
      border: 1px solid rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .cart-back-sticker {
      width: 100%;
      height: 76%;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(0, 0, 0, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(20, 24, 36, 0.7);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Lateral esquerda */
    .cart-left {
      width: var(--d);
      height: var(--h);
      left: calc((var(--w) - var(--d)) / 2);
      transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
      background: linear-gradient(180deg, var(--cart-gray), var(--cart-gray-dark));
      border: 1px solid rgba(0, 0, 0, 0.22);
    }

    /* Lateral direita */
    .cart-right {
      width: var(--d);
      height: var(--h);
      left: calc((var(--w) - var(--d)) / 2);
      transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
      background: linear-gradient(180deg, var(--cart-gray-dark), var(--cart-gray-deep));
      border: 1px solid rgba(0, 0, 0, 0.28);
    }

    /* Topo do cartucho */
    .cart-top {
      width: var(--w);
      height: var(--d);
      top: calc((var(--h) - var(--d)) / 2);
      transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
      background: linear-gradient(90deg, var(--cart-gray-light), var(--cart-gray));
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    /* Base com encaixe de conectores */
    .cart-bottom {
      width: var(--w);
      height: var(--d);
      top: calc((var(--h) - var(--d)) / 2);
      transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
      background: var(--cart-gray-deep);
      border: 1px solid rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-pins {
      width: 72%;
      height: 10px;
      background: repeating-linear-gradient(
        to right,
        #23262e 0px,
        #23262e 3px,
        #8c9099 3px,
        #8c9099 6px
      );
      border-radius: 2px;
    }

    /* Sombra projetada abaixo do cartucho */
    .cart-shadow {
      position: absolute;
      bottom: 6px;
      width: 190px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      filter: blur(10px);
      pointer-events: none;
    }

    .btn-arrow {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: rgba(15, 18, 28, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-arrow:hover {
      background: rgba(30, 35, 52, 0.96);
    }

    .btn-arrow:active {
      transform: scale(0.95);
    }

    .btn-back-cover {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 10;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffd166;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.45rem;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .btn-play {
      width: 100%;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      box-shadow: 0 10px 24px rgba(217, 56, 30, 0.35);
    }

    .btn-play:hover {
      background: var(--accent-hover);
    }

    .btn-play:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error {
      color: #ff6b6b;
    }

    /* Área do emulador */
    #emulator-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      z-index: 10;
    }

    #emulator-screen.active {
      display: block;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    .btn-exit {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 60;
    }

    .btn-pad-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 60;
      height: 38px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      background: rgba(15, 18, 28, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }

    /* Controle virtual de apoio */
    .custom-pad {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14px;
      z-index: 55;
      padding: 0 16px;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      user-select: none;
      touch-action: none;
    }

    .custom-pad.active {
      display: flex;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
      pointer-events: auto;
    }

    .vbtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      background: rgba(20, 24, 36, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      touch-action: none;
      user-select: none;
    }

    .vbtn.pressed {
      background: rgba(217, 56, 30, 0.85);
      transform: scale(0.95);
    }

    .action-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .ab-group {
      display: flex;
      gap: 12px;
    }

    .vbtn-ab {
      width: 60px;
      height: 60px;
      border-radius: 999px;
      font-size: 1rem;
    }

    .sys-group {
      display: flex;
      gap: 8px;
    }

    .vbtn-sys {
      padding: 6px 10px;
      font-size: 0.7rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main class="launcher" id="launcher">
    <section class="card">
      <div class="cart-stage" id="cart-stage">
        <button class="btn-arrow btn-back-cover" id="btn-back-cover" type="button" aria-label="Voltar" title="Voltar">←</button>

        <div class="nes-cart" id="nes-cart">
          <div class="cart-face cart-front">
            <div class="cart-ridge-grip"></div>
            <div class="cart-label">
              <img src="Mega%20Man%203%20NES.jpg" alt="Capa de Mega Man 3 no cartucho NES" />
            </div>
          </div>

          <div class="cart-face cart-back">
            <div class="cart-back-sticker">NINTENDO • NES</div>
          </div>

          <div class="cart-face cart-left"></div>
          <div class="cart-face cart-right"></div>
          <div class="cart-face cart-top"></div>
          <div class="cart-face cart-bottom">
            <div class="cart-pins"></div>
          </div>
        </div>

        <div class="cart-shadow"></div>
      </div>

      <span class="badge">Nintendo Entertainment System • NES</span>
      <h1>Mega Man 3</h1>
      <p class="subtitle">Toca em jogar para iniciar o emulador no navegador.</p>
      <button class="btn-play" id="btn-start" type="button">▶ Jogar Agora</button>
      <p class="status" id="status-msg"></p>
    </section>
  </main>

  <section id="emulator-screen" aria-label="Tela do jogo">
    <button class="btn-arrow btn-exit" id="btn-exit" type="button" aria-label="Voltar à capa" title="Voltar à capa">←</button>
    <button class="btn-pad-toggle" id="btn-pad-toggle" type="button">Controle</button>
    <div id="game"></div>

    <div class="custom-pad" id="custom-pad" aria-label="Controle virtual">
      <div class="dpad">
        <div></div>
        <button class="vbtn" data-key="ArrowUp" data-code="ArrowUp" type="button">▲</button>
        <div></div>
        <button class="vbtn" data-key="ArrowLeft" data-code="ArrowLeft" type="button">◀</button>
        <div></div>
        <button class="vbtn" data-key="ArrowRight" data-code="ArrowRight" type="button">▶</button>
        <div></div>
        <button class="vbtn" data-key="ArrowDown" data-code="ArrowDown" type="button">▼</button>
        <div></div>
      </div>

      <div class="action-group">
        <div class="ab-group">
          <button class="vbtn vbtn-ab" data-key="z" data-code="KeyZ" type="button">B</button>
          <button class="vbtn vbtn-ab" data-key="x" data-code="KeyX" type="button">A</button>
        </div>
        <div class="sys-group">
          <button class="vbtn vbtn-sys" data-key="Shift" data-code="ShiftRight" type="button">SELECT</button>
          <button class="vbtn vbtn-sys" data-key="Enter" data-code="Enter" type="button">START</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    const ROM_FILENAME = "mega-man-3.nes";
    const COVER_FILENAME = "Mega Man 3 NES.jpg";

    const launcherEl = document.getElementById("launcher");
    const emulatorScreenEl = document.getElementById("emulator-screen");
    const gameContainerEl = document.getElementById("game");
    const cartStageEl = document.getElementById("cart-stage");
    const nesCartEl = document.getElementById("nes-cart");
    const btnStart = document.getElementById("btn-start");
    const btnExit = document.getElementById("btn-exit");
    const btnBackCover = document.getElementById("btn-back-cover");
    const btnPadToggle = document.getElementById("btn-pad-toggle");
    const customPadEl = document.getElementById("custom-pad");
    const statusMsg = document.getElementById("status-msg");

    let emulatorLoaded = false;

    function updateCartTilt(clientX, clientY) {
      const rect = cartStageEl.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
      const ry = (x - 0.5) * 44;
      const rx = (0.5 - y) * 28;

      nesCartEl.style.setProperty("--rx", `${rx.toFixed(2)}deg`);
      nesCartEl.style.setProperty("--ry", `${ry.toFixed(2)}deg`);
      nesCartEl.style.setProperty("--gx", `${(x * 100).toFixed(0)}%`);
      nesCartEl.style.setProperty("--gy", `${(y * 100).toFixed(0)}%`);
    }

    function resetCartTilt() {
      nesCartEl.style.setProperty("--rx", "6deg");
      nesCartEl.style.setProperty("--ry", "-18deg");
      nesCartEl.style.setProperty("--gx", "50%");
      nesCartEl.style.setProperty("--gy", "30%");
    }

    cartStageEl.addEventListener("pointermove", (e) => {
      if (e.target.closest(".btn-back-cover")) return;
      updateCartTilt(e.clientX, e.clientY);
    });

    cartStageEl.addEventListener("pointerleave", resetCartTilt);
    cartStageEl.addEventListener("pointercancel", resetCartTilt);

    async function verificarRomAcessivel(url) {
      try {
        const res = await fetch(url, { method: "HEAD", cache: "no-store" });
        if (!res.ok) {
          return { ok: false, motivo: `Não foi possível aceder à ROM (HTTP ${res.status}).` };
        }
        const len = Number(res.headers.get("content-length") || 0);
        if (res.headers.has("content-length") && len < 1024) {
          return { ok: false, motivo: "O ficheiro da ROM parece vazio ou corrompido (< 1 KB)." };
        }
        return { ok: true };
      } catch (err) {
        return { ok: true };
      }
    }

    function iniciarEmulatorJS(romUrl) {
      if (emulatorLoaded) return;
      emulatorLoaded = true;

      window.EJS_player = "#game";
      window.EJS_core = "nes";
      window.EJS_gameName = "Mega Man 3";
      window.EJS_gameUrl = romUrl;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_fullscreenOnLoaded = false;
      window.EJS_virtualGamepad = true;
      window.EJS_backgroundImage = encodeURI(COVER_FILENAME);

      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.async = true;
      script.onerror = () => {
        statusMsg.textContent = "Falha ao carregar o motor do EmulatorJS. Verifica a tua ligação.";
        statusMsg.classList.add("error");
      };
      document.body.appendChild(script);
    }

    function sendEmulatorKey(type, key, code) {
      const target = document.querySelector("#game canvas") || window;
      const event = new KeyboardEvent(type, {
        key,
        code,
        bubbles: true,
        cancelable: true
      });
      target.dispatchEvent(event);
      if (target !== window) {
        window.dispatchEvent(event);
      }
    }

    document.querySelectorAll("#custom-pad .vbtn").forEach((btn) => {
      const key = btn.dataset.key;
      const code = btn.dataset.code;

      const onDown = (e) => {
        e.preventDefault();
        btn.classList.add("pressed");
        sendEmulatorKey("keydown", key, code);
      };

      const onUp = (e) => {
        e.preventDefault();
        btn.classList.remove("pressed");
        sendEmulatorKey("keyup", key, code);
      };

      btn.addEventListener("pointerdown", onDown);
      btn.addEventListener("pointerup", onUp);
      btn.addEventListener("pointercancel", onUp);
      btn.addEventListener("lostpointercapture", onUp);
    });

    btnPadToggle.addEventListener("click", () => {
      customPadEl.classList.toggle("active");
    });

    btnStart.addEventListener("click", async () => {
      statusMsg.classList.remove("error");
      statusMsg.textContent = "A verificar ficheiro da ROM...";

      const romUrl = encodeURI(ROM_FILENAME);
      const check = await verificarRomAcessivel(romUrl);

      if (!check.ok) {
        statusMsg.textContent = `${check.motivo} Confere o nome exato do ficheiro .nes na pasta.`;
        statusMsg.classList.add("error");
        return;
      }

      launcherEl.style.display = "none";
      emulatorScreenEl.classList.add("active");
      gameContainerEl.style.width = "100%";
      gameContainerEl.style.height = "100%";

      iniciarEmulatorJS(romUrl);
    });

    btnBackCover.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        statusMsg.textContent = "Já estás na tela inicial do jogo.";
      }
    });

    btnExit.addEventListener("click", () => {
      window.location.reload();
    });
  </script>
</body>
</html>
