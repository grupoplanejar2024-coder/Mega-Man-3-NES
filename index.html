<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mega Man 3 (NES) — Kubo Touch</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #141824;
      --accent: #d9381e;
      --accent-hover: #f24b30;
      --text: #f5f7fa;
      --muted: #9aa3b2;
      --border: rgba(255, 255, 255, 0.08);
      --nes-top: #9fa3ac;
      --nes-mid: #8b8f98;
      --nes-dark: #6d717a;
      --nes-deep: #52555c;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #181e2e 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .launcher {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    /* Palco 3D do Cartucho NES Clássico */
    .cart-stage {
      position: relative;
      width: 100%;
      height: 296px;
      margin-bottom: 18px;
      perspective: 1100px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .nes-cart {
      --rx: 5deg;
      --ry: -14deg;
      --gx: 52%;
      --gy: 28%;
      --w: 214px;
      --h: 248px;
      --d: 32px;

      position: relative;
      width: var(--w);
      height: var(--h);
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transition: transform 0.14s ease-out;
    }

    .cart-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
    }

    /* Frente fiel ao formato clássico NES */
    .cart-front {
      width: var(--w);
      height: var(--h);
      transform: translateZ(calc(var(--d) / 2));
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.55));
    }

    /* Corpo cinza superior até o recorte inferior esquerdo */
    .cart-body-upper {
      position: absolute;
      inset: 0 0 22px 0;
      background: linear-gradient(155deg, var(--nes-top) 0%, var(--nes-mid) 58%, var(--nes-dark) 100%);
      border-radius: 5px 5px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-left: 1px solid rgba(255, 255, 255, 0.22);
      border-right: 1px solid rgba(0, 0, 0, 0.35);
      clip-path: polygon(
        0% 0%,
        100% 0%,
        100% 100%,
        11% 100%,
        11% 92%,
        0% 92%
      );
    }

    /* Aba inferior direita */
    .cart-foot-right {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 89%;
      height: 24px;
      background: linear-gradient(180deg, var(--nes-mid), var(--nes-dark));
      border-bottom: 2px solid var(--nes-deep);
      border-right: 1px solid rgba(0, 0, 0, 0.35);
      border-radius: 0 0 4px 2px;
    }

    /* Rebaixo superior esquerdo do cartucho NES */
    .cart-top-notches {
      position: absolute;
      top: 0;
      left: 24px;
      width: 48px;
      height: 54px;
      background: linear-gradient(180deg, #636770 0%, #777b85 100%);
      border-left: 1px solid rgba(0, 0, 0, 0.35);
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 1px solid rgba(0, 0, 0, 0.35);
      border-radius: 0 0 4px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 6px 5px;
      z-index: 2;
    }

    .cart-top-notches span {
      display: block;
      height: 2px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.38);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    /* Coluna de ranhuras verticais à esquerda do rótulo */
    .cart-ribs {
      position: absolute;
      top: 58px;
      left: 24px;
      width: 48px;
      height: 146px;
      border-radius: 3px;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.22), rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.24)),
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.28) 0px,
          rgba(0, 0, 0, 0.28) 2px,
          rgba(255, 255, 255, 0.22) 2px,
          rgba(255, 255, 255, 0.22) 5px
        );
      border: 1px solid rgba(0, 0, 0, 0.22);
      z-index: 2;
    }

    /* Rótulo / Capa do jogo no lado direito da frente */
    .cart-label {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 118px;
      height: 192px;
      border-radius: 3px;
      overflow: hidden;
      background: #0d1018;
      border: 2px solid #252830;
      box-shadow:
        inset 0 0 6px rgba(0, 0, 0, 0.7),
        0 1px 0 rgba(255, 255, 255, 0.25);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Friso horizontal sutil abaixo do rótulo */
    .cart-lower-groove {
      position: absolute;
      left: 82px;
      right: 22px;
      bottom: 34px;
      height: 3px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.22);
      z-index: 2;
    }

    /* Reflexo especular sobre a frente */
    .cart-front::after {
      content: "";
      position: absolute;
      inset: 0 0 22px 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(
        circle at var(--gx) var(--gy),
        rgba(255, 255, 255, 0.26) 0%,
        rgba(255, 255, 255, 0.05) 38%,
        transparent 70%
      );
      mix-blend-mode: screen;
    }

    /* Traseira do cartucho */
    .cart-back {
      width: var(--w);
      height: var(--h);
      transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
      background: linear-gradient(180deg, var(--nes-dark), var(--nes-deep));
      border: 1px solid rgba(0, 0, 0, 0.35);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .cart-back-sticker {
      width: 100%;
      height: 76%;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(20, 24, 36, 0.75);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Lateral esquerda */
    .cart-left {
      width: var(--d);
      height: var(--h);
      left: calc((var(--w) - var(--d)) / 2);
      transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
      background: linear-gradient(180deg, var(--nes-mid), var(--nes-dark));
      border: 1px solid rgba(0, 0, 0, 0.25);
    }

    /* Lateral direita */
    .cart-right {
      width: var(--d);
      height: var(--h);
      left: calc((var(--w) - var(--d)) / 2);
      transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
      background: linear-gradient(180deg, var(--nes-dark), var(--nes-deep));
      border: 1px solid rgba(0, 0, 0, 0.3);
    }

    /* Topo do cartucho */
    .cart-top {
      width: var(--w);
      height: var
