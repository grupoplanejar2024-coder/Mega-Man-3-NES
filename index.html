<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1021" />
  <title>Kubo Touch — Mega Man 3 (NES)</title>
  <style>
    :root {
      --bg: #070b17;
      --panel: #11182d;
      --accent: #2563eb;
      --accent-2: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #13224a 0%, var(--bg) 65%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 16px;
    }

    .topbar {
      width: 100%;
      max-width: 920px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(17, 24, 45, 0.85);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid rgba(96, 165, 250, 0.45);
      color: #bfdbfe;
    }

    .stage {
      width: 100%;
      max-width: 920px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .hero {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 18px;
      align-items: center;
    }

    .cover-wrap {
      perspective: 900px;
    }

    .cover-3d {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.6);
      transform: rotateY(-8deg) rotateX(3deg);
      transition: transform 0.35s ease;
      display: block;
    }

    .cover-wrap:hover .cover-3d {
      transform: rotateY(0deg) rotateX(0deg) scale(1.02);
    }

    .meta h1 {
      margin: 0 0 6px;
      font-size: clamp(1.35rem, 3vw, 2rem);
    }

    .meta p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button,
    .file-label {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease;
    }

    button:active,
    .file-label:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }

    input[type="file"] {
      display: none;
    }

    .emulator-shell {
      margin-top: 18px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      aspect-ratio: 4 / 3;
      width: 100%;
      position: relative;
      display: none;
    }

    .emulator-shell.active {
      display: block;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    .touch-pad {
      margin-top: 16px;
      display: none;
      user-select: none;
      touch-action: none;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(9, 13, 26, 0.85);
      border: 1px solid var(--border);
    }

    .touch-pad.active {
      display: flex;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
    }

    .pad-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      font-weight: 700;
      padding: 0;
      justify-content: center;
      min-height: 52px;
      min-width: 52px;
    }

    .pad-btn.round {
      border-radius: 999px;
      width: 60px;
      height: 60px;
      background: rgba(37, 99, 235, 0.28);
      border-color: rgba(96, 165, 250, 0.5);
    }

    .pad-btn.b-btn {
      background: rgba(239, 68, 68, 0.28);
      border-color: rgba(248, 113, 113, 0.5);
    }

    .action-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .ab-row,
    .sys-row {
      display: flex;
      gap: 10px;
    }

    .sys-btn {
      padding: 8px 12px;
      min-height: auto;
      font-size: 0.75rem;
      border-radius: 999px;
    }

    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .hero {
        grid-template-columns: 110px 1fr;
        gap: 14px;
      }

      .touch-pad {
        flex-direction: column;
      }

      .action-cluster {
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>KUBO TOUCH</span>
      <span class="badge">NES • FCEUmm</span>
    </div>
    <span class="badge" id="pwa-status">NFC Ready</span>
  </header>

  <main class="stage">
    <section class="hero">
      <div class="cover-wrap">
        <img
          class="cover-3d"
          src="Mega Man 3 NES_4.jpg"
          alt="Capa europeia de Mega Man 3 para Nintendo Entertainment System"
        />
      </div>
      <div class="meta">
        <h1>Mega Man 3</h1>
        <p>
          Plataforma clássica da Capcom para o Nintendo Entertainment System (1990), com o cão robótico Rush,
          o deslize tático e oito Robot Masters.
        </p>
        <div class="actions">
          <button class="btn-primary" id="start-btn" type="button">Iniciar Jogo</button>
          <label class="file-label btn-secondary" for="rom-input">
            Carregar ROM (.nes)
          </label>
          <input id="rom-input" type="file" accept=".nes" />
          <button class="btn-secondary" id="toggle-pad-btn" type="button">Controlo Táctil</button>
        </div>
        <div class="status" id="status-msg">
          Pronto para iniciar a partir de <code>./roms/mega-man-3.nes</code> ou carregar um ficheiro local.
        </div>
      </div>
    </section>

    <section class="emulator-shell" id="emulator-shell" aria-label="Área do emulador">
      <div id="game"></div>
    </section>

    <section class="touch-pad" id="touch-pad" aria-label="Comando virtual NES">
      <div class="dpad">
        <div></div>
        <button class="pad-btn" data-key="ArrowUp" type="button">▲</button>
        <div></div>
        <button class="pad-btn" data-key="ArrowLeft" type="button">◀</button>
        <div></div>
        <button class="pad-btn" data-key="ArrowRight" type="button">▶</button>
        <div></div>
        <button class="pad-btn" data-key="ArrowDown" type="button">▼</button>
        <div></div>
      </div>

      <div class="action-cluster">
        <div class="ab-row">
          <button class="pad-btn round b-btn" data-key="KeyZ" type="button">B</button>
          <button class="pad-btn round" data-key="KeyX" type="button">A</button>
        </div>
        <div class="sys-row">
          <button class="pad-btn sys-btn" data-key="ShiftRight" type="button">SELECT</button>
          <button class="pad-btn sys-btn" data-key="Enter" type="button">START</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_ROM_URL = "./roms/mega-man-3.nes";
    let customRomObjectUrl = null;
    let emulatorLoaded = false;

    const startBtn = document.getElementById("start-btn");
    const romInput = document.getElementById("rom-input");
    const togglePadBtn = document.getElementById("toggle-pad-btn");
    const shell = document.getElementById("emulator-shell");
    const touchPad = document.getElementById("touch-pad");
    const statusMsg = document.getElementById("status-msg");

    function setStatus(text) {
      statusMsg.innerHTML = text;
    }

    function launchEmulator(romUrl, label) {
      shell.classList.add("active");
      if (window.innerWidth <= 900) {
        touchPad.classList.add("active");
      }

      window.EJS_player = "#game";
      window.EJS_core = "fceumm";
      window.EJS_gameName = "Mega Man 3";
      window.EJS_gameUrl = romUrl;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_language = "pt-PT";

      if (!emulatorLoaded) {
        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        script.async = true;
        script.onload = () => {
          emulatorLoaded = true;
          setStatus(`A carregar <strong>Mega Man 3</strong> (${label})...`);
        };
        script.onerror = () => {
          setStatus("Falha ao carregar o EmulatorJS. Verifica a ligação à internet ou o caminho dos ficheiros.");
        };
        document.body.appendChild(script);
      } else {
        setStatus(`ROM actualizada (${label}). Recarrega a página se precisares de reiniciar a instância do núcleo.`);
      }
    }

    startBtn.addEventListener("click", () => {
      launchEmulator(customRomObjectUrl || DEFAULT_ROM_URL, customRomObjectUrl ? "ficheiro local" : "ROM padrão");
    });

    romInput.addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (customRomObjectUrl) {
        URL.revokeObjectURL(customRomObjectUrl);
      }
      customRomObjectUrl = URL.createObjectURL(file);
      setStatus(`Ficheiro selecionado: <strong>${file.name}</strong>. A iniciar...`);
      launchEmulator(customRomObjectUrl, file.name);
    });

    togglePadBtn.addEventListener("click", () => {
      touchPad.classList.toggle("active");
    });

    function dispatchKey(type, code) {
      const ev = new KeyboardEvent(type, {
        code,
        key: code,
        bubbles: true,
        cancelable: true
      });
      window.dispatchEvent(ev);
      document.dispatchEvent(ev);
    }

    document.querySelectorAll(".pad-btn[data-key]").forEach((btn) => {
      const code = btn.dataset.key;
      const press = (e) => {
        e.preventDefault();
        dispatchKey("keydown", code);
      };
      const release = (e) => {
        e.preventDefault();
        dispatchKey("keyup", code);
      };

      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("pointercancel", release);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").then(
          () => {
            document.getElementById("pwa-status").textContent = "PWA Offline Ready";
          },
          () => {
            document.getElementById("pwa-status").textContent = "NFC Ready";
          }
        );
      });
    }
  </script>
</body>
</html>
